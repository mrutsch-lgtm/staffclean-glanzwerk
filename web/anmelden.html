<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#022c22">
<title>Glanzwerk · Anmelden</title>
<link rel="icon" href="/bilder/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/bilder/apple-touch-icon.png">
<link rel="stylesheet" href="/css/stil.css">
</head>
<body class="eingang">
<div class="buehne">
  <img class="wortmarke" src="/bilder/glanzwerk-logo-hell.png" alt="Glanzwerk" width="763" height="165">
  <p class="claim">Planung, Nachweise und Abrechnung für die Gebäudereinigung</p>
  <div class="funken"><span>Einsätze</span><span>Qualität</span><span>Abrechnung</span><span>Personal</span></div>
</div>
<div class="kasten">
  <h2 id="ueber">Anmelden</h2>
  <p class="unter">Mit deinem Glanzwerk-Konto</p>
  <form id="form">
    <label class="feld">E-Mail<input type="email" name="email" autocomplete="username" required></label>
    <label class="feld">Passwort<input type="password" name="passwort" autocomplete="current-password" required></label>
    <div class="fehler" id="fehler"></div>
    <button class="knopf" type="submit" id="los">Bei Glanzwerk anmelden</button>
  </form>
</div>
<p class="fuss">Mitarbeiter? <a href="/app">Zur Glanzwerk-App mit PIN</a></p>
<script src="/js/ui.js"></script>
<script>
(async function () {
  const f = document.getElementById('form'), fe = document.getElementById('fehler');
  try { const e = await (await fetch('/api/einrichten')).json(); if (e.noetig) { location.href = '/einrichten'; return; } } catch (x) {}
  try { const j = await UI.ich(); if (j) { location.href = j.rolle === 'kunde' ? '/kunde' : j.rolle === 'mitarbeiter' ? '/app' : '/'; return; } } catch (x) {}
  f.onsubmit = async function (ev) {
    ev.preventDefault(); fe.textContent = ''; document.getElementById('los').disabled = true;
    const r = await fetch('/api/anmelden', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: f.email.value, passwort: f.passwort.value }) });
    const j = await r.json().catch(function () { return {}; });
    document.getElementById('los').disabled = false;
    if (!r.ok) { fe.textContent = j.fehler || 'Anmeldung fehlgeschlagen'; return; }
    location.href = j.rolle === 'kunde' ? '/kunde' : '/';
  };
})();
</script>
</body>
</html>
