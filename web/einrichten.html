<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#022c22">
<title>Glanzwerk · Einrichten</title>
<link rel="icon" href="/bilder/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/bilder/apple-touch-icon.png">
<link rel="stylesheet" href="/css/stil.css">
</head>
<body class="eingang">
<div class="buehne">
  <img class="wortmarke" src="/bilder/glanzwerk-logo-hell.png" alt="Glanzwerk" width="763" height="165">
  <p class="claim">Willkommen — einmal einrichten, dann geht es los</p>
</div>
<div class="kasten">
  <h2>Glanzwerk einrichten</h2>
  <p class="unter">Einmalig: das erste Büro-Konto anlegen. Das Passwort wählst du selbst, es wird nirgends gespeichert außer als Prüfwert.</p>
  <form id="form">
    <label class="feld" id="codeFeld" hidden>Einrichtungscode<input name="code" autocomplete="off" autocapitalize="characters" placeholder="XXXXX-XXXXX"></label>
    <label class="feld">Name<input name="name" required></label>
    <label class="feld">E-Mail<input type="email" name="email" autocomplete="username" required></label>
    <label class="feld">Passwort (mind. 10 Zeichen)<input type="password" name="passwort" autocomplete="new-password" minlength="10" required></label>
    <label class="feld">Passwort wiederholen<input type="password" name="passwort2" autocomplete="new-password" required></label>
    <div class="fehler" id="fehler"></div>
    <button class="knopf" type="submit">Konto anlegen</button>
  </form>
</div>
<script>
(async function () {
  const f = document.getElementById('form'), fe = document.getElementById('fehler');
  const e = await (await fetch('/api/einrichten')).json();
  if (!e.noetig) { location.href = '/anmelden'; return; }
  if (e.mitCode) { document.getElementById('codeFeld').hidden = false; f.code.required = true; }
  else if (!e.lokal) fe.textContent = 'Das erste Konto lässt sich nur direkt am Rechner anlegen.';
  f.onsubmit = async function (ev) {
    ev.preventDefault(); fe.textContent = '';
    if (f.passwort.value !== f.passwort2.value) { fe.textContent = 'Die Passwörter sind nicht gleich.'; return; }
    const r = await fetch('/api/einrichten', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: f.name.value, email: f.email.value, passwort: f.passwort.value, code: f.code.value }) });
    const j = await r.json().catch(function () { return {}; });
    if (!r.ok) { fe.textContent = j.fehler || 'Fehler'; return; }
    location.href = '/';
  };
})();
</script>
</body>
</html>
